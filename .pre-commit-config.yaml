repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: frontend-lint
        name: eslint + prettier
        entry: bash -c 'cd frontend && npx eslint . && npx prettier --check src'
        language: system
        files: ^frontend/
        pass_filenames: false
