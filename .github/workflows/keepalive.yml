name: Keep API warm

# Render's free instance sleeps after 15 idle minutes, and the next visitor waits about a
# minute for it to wake. Pinging the health check keeps it awake while the app is in review.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://trucker-api-vxmt.onrender.com/api/health/
