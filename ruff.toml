line-length = 120
target-version = "py312"
extend-exclude = ["**/migrations/**", "frontend"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012", "B905"]

[lint.isort]
known-first-party = ["config", "accounts", "trips", "providers", "tests"]
