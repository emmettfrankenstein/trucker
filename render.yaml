# One-click deploy on Render: Dashboard → New → Blueprint → pick this repo.
# Set TOMTOM_API_KEY when prompted. The frontend is a static site that talks to the API.
services:
  - type: web
    name: trucker-api
    runtime: docker
    rootDir: backend
    plan: starter # the free plan sleeps; a cold start would hurt the first impression
    healthCheckPath: /api/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: TOMTOM_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase: { name: trucker-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: trucker-cache, property: connectionString }
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://trucker-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://trucker-api.onrender.com

  - type: keyvalue
    name: trucker-cache
    plan: free
    ipAllowList: []

  - type: web
    name: trucker-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://trucker-api.onrender.com
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: trucker-db
    plan: free
