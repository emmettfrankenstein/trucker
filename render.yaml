# API on Render (free): Dashboard → New → Blueprint → pick this repo, and set TOMTOM_API_KEY
# and CORS_ALLOWED_ORIGINS (your Vercel URL) when prompted. The frontend deploys to Vercel
# (see frontend/vercel.json). Free instances sleep when idle: open the app once before sharing.
services:
  - type: web
    name: trucker-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: TOMTOM_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase: { name: trucker-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: trucker-cache, property: connectionString }
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://trucker.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://trucker-api.onrender.com

  - type: keyvalue
    name: trucker-cache
    plan: free
    ipAllowList: []

databases:
  - name: trucker-db
    plan: free
